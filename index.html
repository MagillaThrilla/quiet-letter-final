<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020100">
  <title>Quiet Letter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=pixel-exact-5">
</head>
<body>
  <main class="experience" id="experience" aria-label="A quiet letter">
    <div class="ambient-background" aria-hidden="true"></div>

    <section class="scene-frame" aria-label="Candlelit desk and letter">
      <div class="scene-canvas" id="sceneCanvas">
        <!-- The exact approved final image is the foundation. -->
        <img
          class="scene-image approved-final"
          src="assets/approved-final.jpg?v=pixel-exact-5"
          alt=""
          aria-hidden="true"
          fetchpriority="high"
        >

        <!--
          Each cover is the exact blank scene, masked to one element.
          Removing a cover reveals the exact approved pixels beneath it.
        -->
        <img class="scene-image cover cover-salutation" src="assets/blank-room.jpg?v=pixel-exact-5" alt="" aria-hidden="true">
        <img class="scene-image cover cover-paragraph-1" src="assets/blank-room.jpg?v=pixel-exact-5" alt="" aria-hidden="true">
        <img class="scene-image cover cover-paragraph-2" src="assets/blank-room.jpg?v=pixel-exact-5" alt="" aria-hidden="true">
        <img class="scene-image cover cover-paragraph-3" src="assets/blank-room.jpg?v=pixel-exact-5" alt="" aria-hidden="true">
        <img class="scene-image cover cover-closing" src="assets/blank-room.jpg?v=pixel-exact-5" alt="" aria-hidden="true">
        <img class="scene-image cover cover-signature" src="assets/blank-room.jpg?v=pixel-exact-5" alt="" aria-hidden="true">
        <img class="scene-image cover cover-daniel" src="assets/blank-room.jpg?v=pixel-exact-5" alt="" aria-hidden="true">
        <div class="cover cover-angela" aria-hidden="true">
          <img class="scene-image angela-blank-base" src="assets/blank-room.jpg?v=pixel-exact-5" alt="">
          <div class="random-pen-concealer">
            <img class="scene-image" src="assets/blank-room.jpg?v=pixel-exact-5" alt="">
          </div>
        </div>

        <img class="scene-image cover cover-link" src="assets/blank-room.jpg?v=pixel-exact-5" alt="" aria-hidden="true">

        <!-- The approved fountain pen remains visible for the entire scene. -->
        <img class="scene-image correct-pen" src="assets/approved-final.jpg?v=pixel-exact-5" alt="" aria-hidden="true">

        <!-- Transparent hit target aligned over the handwritten title in the approved artwork. -->
        <button
          class="song-hit-target"
          id="songLink"
          type="button"
          aria-label="Open Maybe in Another Life"
        >
          <span class="song-title-line">Maybe in</span>
          <span class="song-title-line">Another Life</span>
          <span class="song-action">Tap to listen</span>
        </button>
      </div>
    </section>

    <div class="reading-shade" aria-hidden="true"></div>
    <div class="blackout" id="blackout" aria-hidden="true"></div>

    <audio id="matchSound" preload="auto" src="assets/Match_Strike.mp3"></audio>
  </main>

  <script src="js/app.js?v=pixel-exact-5"></script>
</body>
</html>
