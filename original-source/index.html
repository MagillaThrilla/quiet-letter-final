<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />

  <title>Thank You for Visiting</title>
  <meta
    name="description"
    content="A quiet closing page."
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="retirement-page" aria-label="Quiet Letter retirement page">

  <noscript>
